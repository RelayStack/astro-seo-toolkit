  <text x="120" y="300" font-family="DejaVu Sans, Cantarell, sans-serif" font-size="32" fill="#8b949e">sitemap.xml · robots.txt · drop-in Astro integration</text>

  <rect x="120" y="336" width="1040" height="128" rx="16" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <circle cx="152" cy="368" r="7" fill="#f85149"/>
  <circle cx="176" cy="368" r="7" fill="#d29922"/>
  <circle cx="200" cy="368" r="7" fill="#3fb950"/>
