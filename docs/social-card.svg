<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Astro SEO Toolkit — llms.txt, llms-full.txt, JSON-LD, IndexNow, sitemap.xml, robots.txt">
